name: Linux Build (AppImage, DEB, RPM)

on:
  push:
    branches: [ master ]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Optional exact version override (e.g. 1.1.1); leave empty to use the version from repository files
        required: false
        type: string
      create_release:
        description: Create or update a GitHub Release with the built assets
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve-version:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag_name: ${{ steps.calc.outputs.tag_name }}
      should_release: ${{ steps.calc.outputs.should_release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute release version
        id: calc
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CREATE_RELEASE: ${{ inputs.create_release }}
        run: |
          set -euo pipefail

          source packaging/config
          config_version="${APP_VERSION:-}"
          globals_version="$(sed -nE 's/^[[:space:]]*#define[[:space:]]+TUX_MANAGER_VERSION_STRING[[:space:]]+"([^"]+)".*/\1/p' src/globals.h | head -n 1)"
          flake_version="$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)";.*/\1/p' flake.nix | head -n 1)"

          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            tag_name="${GITHUB_REF_NAME}"
            version="${tag_name#v}"
            should_release="true"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION#v}"
            tag_name="${version}"
            should_release="${INPUT_CREATE_RELEASE:-true}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_name="${GITHUB_REF_NAME}"
            version="${tag_name#v}"
            should_release="${INPUT_CREATE_RELEASE:-true}"
          else
            if [ -z "${config_version}" ] || [ -z "${globals_version}" ] || [ -z "${flake_version}" ]; then
              echo "Error: failed to read version from packaging/config ('${config_version}'), src/globals.h ('${globals_version}'), or flake.nix ('${flake_version}')." >&2
              exit 1
            fi

            if [ "${config_version}" != "${globals_version}" ] || [ "${config_version}" != "${flake_version}" ]; then
              echo "Error: version mismatch across repository files:" >&2
              echo "  packaging/config: ${config_version}" >&2
              echo "  src/globals.h:    ${globals_version}" >&2
              echo "  flake.nix:        ${flake_version}" >&2
              echo "Please update all version files to match before releasing." >&2
              exit 1
            fi

            version="${config_version}"
            tag_name="${version}"
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              should_release="${INPUT_CREATE_RELEASE:-true}"
            else
              should_release="true"
            fi
          fi

          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+(\.[0-9]+)*([.+~][0-9A-Za-z.+~]+)?$'; then
            echo "Error: invalid version '${version}' (must be valid for RPM/DEB/Arch without hyphens)." >&2
            exit 1
          fi

          echo "File versions: packaging/config=${config_version}, src/globals.h=${globals_version}, flake.nix=${flake_version}"
          echo "Resolved package version: ${version}"
          echo "Resolved git tag: ${tag_name}"
          echo "Create/update release: ${should_release}"

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"
          echo "should_release=${should_release}" >> "${GITHUB_OUTPUT}"

  build-appimage:
    name: Build Linux AppImage
    needs: resolve-version
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            qmake6 \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-l10n-tools \
            qt6-svg-dev \
            libqt6svg6 \
            libgl1-mesa-dev \
            libfuse2t64 \
            file \
            wget \
            curl

      - name: Install linuxdeploy and plugins
        run: |
          mkdir -p /tmp/linuxdeploy && cd /tmp/linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x *.AppImage

          # Extract AppImages to /opt to completely bypass FUSE requirements in CI
          ./linuxdeploy-x86_64.AppImage --appimage-extract
          sudo mv squashfs-root /opt/linuxdeploy
          sudo ln -sf /opt/linuxdeploy/AppRun /usr/local/bin/linuxdeploy

          ./linuxdeploy-plugin-qt-x86_64.AppImage --appimage-extract
          sudo mv squashfs-root /opt/linuxdeploy-plugin-qt
          sudo ln -sf /opt/linuxdeploy-plugin-qt/AppRun /usr/local/bin/linuxdeploy-plugin-qt

          ./linuxdeploy-plugin-appimage-x86_64.AppImage --appimage-extract
          sudo mv squashfs-root /opt/linuxdeploy-plugin-appimage
          sudo ln -sf /opt/linuxdeploy-plugin-appimage/AppRun /usr/local/bin/linuxdeploy-plugin-appimage

          # Ensure lrelease is in expected path for Qt6 tools if needed
          if [ ! -x /usr/lib/qt6/bin/lrelease ] && command -v lrelease-qt6 >/dev/null 2>&1; then
            sudo ln -sf "$(command -v lrelease-qt6)" /usr/lib/qt6/bin/lrelease
          fi

      - name: Build AppImage
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          cd packaging
          ./package-appimage.sh --version "${RELEASE_VERSION}"

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: TuxManager-Linux-AppImage
          path: packaging/output/*.AppImage
          if-no-files-found: error

  build-deb:
    name: Build Linux DEB
    needs: resolve-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper \
            dpkg-dev \
            pkg-config \
            qmake6 \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-l10n-tools \
            qt6-svg-dev \
            libqt6svg6 \
            libgl1-mesa-dev

      - name: Build DEB
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          cd packaging
          ./package-deb.sh --version "${RELEASE_VERSION}"

      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        with:
          name: TuxManager-Linux-DEB
          path: packaging/output/*.deb
          if-no-files-found: error

  build-rpm:
    name: Build Linux RPM (${{ matrix.fedora-version == 'latest' && 'Fedora Latest' || format('Fedora {0}', matrix.fedora-version) }})
    needs: resolve-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fedora-version: "latest"
            artifact-name: "TuxManager-Linux-RPM-Fedora-latest"
          - fedora-version: "44"
            artifact-name: "TuxManager-Linux-RPM-Fedora-44"
    container:
      image: fedora:${{ matrix.fedora-version }}

    steps:
      - name: Install build dependencies
        run: |
          dnf install -y \
            rpm-build \
            rsync \
            git \
            pkgconf-pkg-config \
            qt6-qtbase-devel \
            qt6-linguist \
            qt6-qtsvg-devel \
            gcc-c++ \
            make

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build RPM
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd packaging
          ./package-rpm.sh --version "${RELEASE_VERSION}"

      - name: Upload Linux RPM
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: packaging/output/*.rpm
          if-no-files-found: error

  create-release:
    name: Upload Release Assets
    needs: [resolve-version, build-appimage, build-deb, build-rpm]
    if: needs.resolve-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        if: github.event_name != 'release'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: TuxManager-Linux-AppImage
          path: release_assets/

      - name: Download Linux DEB
        uses: actions/download-artifact@v4
        with:
          name: TuxManager-Linux-DEB
          path: release_assets/

      - name: Download Linux RPMs
        uses: actions/download-artifact@v4
        with:
          pattern: TuxManager-Linux-RPM*
          path: release_assets/
          merge-multiple: true

      - name: Upload Assets to Existing GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          files: release_assets/*

      - name: Generate release notes from commit messages
        if: github.event_name != 'release'
        env:
          TAG_NAME: ${{ needs.resolve-version.outputs.tag_name }}
        run: |
          set -euo pipefail

          prev_tag="$(git describe --tags --abbrev=0 \
            --match="[0-9]*" --match="v[0-9]*" \
            --exclude="${TAG_NAME}" --exclude="v${TAG_NAME}" \
            HEAD 2>/dev/null || true)"

          notes_file="${RUNNER_TEMP}/release_notes.md"
          if [ -n "${prev_tag}" ]; then
            git log --format="- %s" "${prev_tag}..HEAD" > "${notes_file}"
          else
            git log -n 50 --format="- %s" HEAD > "${notes_file}"
          fi

          if [ ! -s "${notes_file}" ]; then
            git log -1 --format="- %s" HEAD > "${notes_file}"
          fi

          echo "Previous version tag: ${prev_tag:-<none>}"
          cat "${notes_file}"

      - name: Sync existing git tag to current commit
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.resolve-version.outputs.tag_name }}
        run: |
          set -euo pipefail
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" --jq 'if type == "object" then .object.sha else empty end' 2>/dev/null || true)"
          if [ -n "${existing_sha}" ] && [ "${existing_sha}" != "${GITHUB_SHA}" ]; then
            echo "Updating existing tag ${TAG_NAME} (${existing_sha}) -> ${GITHUB_SHA}"
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG_NAME}" \
              -f sha="${GITHUB_SHA}" \
              -F force=true >/dev/null
          fi

      - name: Create or Update GitHub Release and Upload Assets
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.resolve-version.outputs.version }}
          body_path: ${{ runner.temp }}/release_notes.md
          overwrite_files: true
          files: release_assets/*
